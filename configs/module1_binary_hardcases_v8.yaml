# Module ① 이진 재학습 — v8 라운드 (보호집단 공정성 보강)
#
# 문제: 배포 대상 v6(revision 31b33415)이 보호집단 공정성 게이트를 넘지 못한다.
#   KOLD 위험 재현율 격차 0.1263 > 게이트 0.10
#   최저 gender-female 0.8288 / gender-LGBTQ+ 0.8438 / race-others 0.8698
#   근거: artifacts/safe_binary_fairness_v6_31b33415.json
#   비교: v4_r1(3e9c0b80)은 같은 축에서 0.0906 통과 → v6에서 후퇴한 것이다.
#
# 계보: v6 ⊇ + 약집단 train 오버샘플. v7(사기 합성)은 사람 승인 전이라 넣지 않는다.
#   신규 소스는 노트북 14가 train split 에서만 뽑아 생성하며, val/test/blind 와
#   교차 검증한 뒤 기록한다. 원문을 새로 만들지 않으므로 라벨 노이즈가 늘지 않는다.
model:
  name: "beomi/KcELECTRA-base-v2022"
  num_labels: 2
  max_length: 128
  dropout: 0.1
  checkpoint_dir: "models/checkpoints/module1_binary_hardcases_v8"
data:
  binary: true
  # PAN12 predator (predator만 필터) — 전량 주의
  extra_caution_jsonl: ["data/synthetic/pan12_translated.jsonl"]
  extra_caution_filter:
    split_role: "predator"
  # 라벨 보존 주입: v6 소스 그대로 + 약집단 오버샘플
  extra_train_jsonl:
    - "data/synthetic/safe_hardcases_v5/train.jsonl"
    - "data/synthetic/dktc.jsonl"
    - "data/synthetic/kmhas.jsonl"
    - "data/synthetic/apeach.jsonl"
    - "data/synthetic/fairness_v8/train.jsonl"
  extra_train_repeat: 1
training:
  batch_size: 32
  eval_batch_size: 64
  num_epochs: 3
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_accum_steps: 1
  fp16: true
  seed: 42
loss:
  type: "ce"
  focal_gamma: 0.0
  alpha: [1.0, 1.0]
stacking:
  enabled: false
paths:
  checkpoint_dir: "models/checkpoints/module1_binary_hardcases_v8"
  report_dir: "reports/validation_reports/module1_binary_hardcases_v8"
labels: ["정상", "주의"]
